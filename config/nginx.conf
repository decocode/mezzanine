# Only these paths are pages in the showcase app (see site/AppShell.tsx).
# Any other path gets a real 404 status. Add new routes here.
map $uri $is_app_route {
    default 0;
    ~^/?$ 1;
    ~^/site/lab(/layout(/(intrinsic-primitives(/(stack|cluster|switcher|grid|sidebar|center))?|container-queries|environment-queries|reading-width|target-size|named-layers|logical-properties|subgrid|has|viewport-units|scroll-padding|cascade-layers|emerging-features))?)?/?$ 1;
    ~^/typography/(text-styles|prose)/?$ 1;
    ~^/shape/(corners|borders)/?$ 1;
    ~^/(introduction|usability|inclusivity|creativity|wireframe|light-and-dark-mode|custom-themes|foundations|accessibility|interaction|color|typography|shape|elevation|spacing|motion|icons|badge|button|link|card|code-block|table|tag-group|toggle-button|dialog|tooltip|disclosure|checkbox|radio-group|text-field|text-area|breadcrumbs|navigation-tree|table-of-contents|tabs|pagination|menu|tab-bar|navbar|sidebar|footer)/?$ 1;
}

# Vite puts a content hash in every file name under /assets/, so those can be
# cached for a year. Other public files keep a short cache so replacements show
# up quickly. HTML is always revalidated.
map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~\.(?:webp|png|jpg|jpeg|svg|pdf|ico)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # PRE-LAUNCH: keeps the site out of search engines. Remove this line on launch day.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Unknown paths still show the app, but with a 404 status.
    error_page 404 /index.html;

    location / {
        try_files $uri @app;
    }

    location @app {
        if ($is_app_route = 0) {
            return 404;
        }
        try_files /index.html =404;
    }
}
