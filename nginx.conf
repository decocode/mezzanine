# Only these paths are pages in the showcase app (see site/App.tsx).
# Any other path gets a real 404 status. Add new routes here.
map $uri $is_app_route {
    default 0;
    ~^/?$ 1;
    ~^/(introduction|color|typography|shapes|elevation|textures|spacing|icons|button|link|card|table|carousel|image-viewer|tag-group|toggle-button|disclosure|checkbox|radio-group|text-field|text-area|navigation-tree|header|sidebar|footer|hero-section|logo)/?$ 1;
}

# Vite puts a content hash in every file name under /assets/, so those can be
# cached for a year. Other public files keep a short cache so replacements show
# up quickly. HTML is always revalidated.
map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~\.(?:webp|png|jpg|jpeg|svg|pdf|ico)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # PRE-LAUNCH: keeps the site out of search engines. Remove this line on launch day.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Unknown paths still show the app, but with a 404 status.
    error_page 404 /index.html;

    location / {
        try_files $uri @app;
    }

    location @app {
        if ($is_app_route = 0) {
            return 404;
        }
        try_files /index.html =404;
    }
}
